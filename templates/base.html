<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  {% if current_url is defined %}<link rel="canonical" href="{{ current_url }}">{% endif %}
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ get_url(path='site.css') }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ get_url(path='', trailing_slash=true) }}">{{ config.title }}</a>
    <nav aria-label="Main navigation">
      <a href="{{ get_url(path='', trailing_slash=true) }}">About</a>
      <a href="{{ get_url(path='@/privacy.md') }}">Privacy</a>
      <a href="{{ get_url(path='@/terms.md') }}">Terms</a>
    </nav>
  </header>
  <main class="wrap">
    {% block main %}{% endblock main %}
  </main>
  <footer class="site-footer wrap">
    <p>Support: <a href="mailto:{{ config.extra.support_email }}">{{ config.extra.support_email }}</a></p>
    <p>An independently configured third-party plugin. Not an official Google or Obsidian product.</p>
  </footer>
</body>
</html>
