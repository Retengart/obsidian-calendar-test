name: Publish information site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install pinned Zola
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-musl.tar.gz --output "$RUNNER_TEMP/zola.tar.gz"
          printf '%s  %s\n' '7d77a4220a4f699cba2fc0e0c7859f780e887e269159ad4fab90e11ea16c906f' "$RUNNER_TEMP/zola.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/zola-bin"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola-bin" zola
          printf '%s\n' "$RUNNER_TEMP/zola-bin" >> "$GITHUB_PATH"
      - name: Check and build
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          zola check --skip-external-links
          zola build --base-url "${SITE_BASE_URL%/}/"
      - name: Upload only the built site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
